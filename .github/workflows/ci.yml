name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore InvoiceReader.sln

      - name: Build
        run: dotnet build InvoiceReader.sln --no-restore -c Release

      - name: Test
        run: dotnet test InvoiceReader.sln --no-build -c Release --logger "console;verbosity=normal"

      - name: Docker image builds
        run: docker build -t invoice-reader .
