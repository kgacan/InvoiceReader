# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New > Blueprint, pick this repo. Every push to main deploys after GitHub CI passes.
# This is the free DEMO (invented data, resets on restart). Real offices: render-pilot.yaml.
services:
  - type: web
    name: invoicereader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080" # the container listens on 8080 (see Dockerfile)
      - key: Mode
        value: Demo
      - key: Demo__Email
        value: demo@demo.ba
      - key: Demo__Password
        sync: false # asked for when the Blueprint is created; never committed
      # Gemini free tier: Google may use the files to improve its products, so only send
      # invoices you are allowed to share (never client documents). Paid AI: switch to Claude.
      - key: Ai__Provider
        value: Gemini
      - key: Ai__GeminiModel
        value: gemini-3.5-flash-lite # fast; minimal thinking by default
      - key: Ai__GeminiApiKey
        sync: false # set in Render > Environment; without it the app falls back to Demo mode
